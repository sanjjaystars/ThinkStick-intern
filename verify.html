<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Certificate — DarkSyntax</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --void: #0A0C0E;
    --panel: #12161A;
    --panel-2: #171C21;
    --copper: #FFB000;
    --copper-dim: #7A5A1E;
    --teal: #00D9B5;
    --red: #FF5C5C;
    --text: #F2EFE9;
    --muted: #8A8F94;
    --line: #22282E;
    --disp: 'Space Grotesk', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--void); color: var(--text); font-family: var(--body);
    min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden;
  }
  ::selection { background: var(--copper); color: #0A0C0E; }
  .pcb-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 15% 20%, rgba(0, 217, 181, 0.05), transparent 40%),
      radial-gradient(circle at 85% 70%, rgba(255, 176, 0, 0.06), transparent 45%),
      repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.012) 0px, rgba(255, 255, 255, 0.012) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.012) 0px, rgba(255, 255, 255, 0.012) 1px, transparent 1px, transparent 42px);
  }
  nav {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 5vw; font-family: var(--mono); font-size: 13px; letter-spacing: 1px;
  }
  nav .logo { font-family: var(--disp); font-weight: 700; font-size: 16px; letter-spacing: 2px; text-decoration: none; color: var(--text); }
  nav .logo span { color: var(--copper); }
  nav a.back { color: var(--muted); text-decoration: none; }
  nav a.back:hover { color: var(--text); }

  main {
    position: relative; z-index: 1; flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 5vw 100px;
  }
  .wrap { width: 100%; max-width: 760px; }

  .lookup {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 40px; text-align: center;
  }
  .lookup h1 { font-family: var(--disp); font-size: 26px; margin-bottom: 10px; }
  .lookup p { color: var(--muted); font-size: 14px; margin-bottom: 26px; }
  .lookup-row { display: flex; gap: 10px; max-width: 420px; margin: 0 auto; }
  .lookup input {
    flex: 1; background: var(--void); border: 1px solid var(--line); color: var(--text);
    font-family: var(--mono); font-size: 14px; padding: 12px 14px; border-radius: 4px;
  }
  .lookup input:focus { outline: none; border-color: var(--copper); }
  .lookup button {
    font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
    background: var(--copper); color: #0A0C0E; border: none; border-radius: 4px;
    padding: 0 22px; cursor: pointer; transition: background .2s ease, transform .2s ease;
  }
  .lookup button:hover { background: #ffc233; transform: translateY(-1px); }

  .boot { font-family: var(--mono); font-size: 13px; color: var(--muted); text-align: center; padding: 60px 20px; }
  .boot .cursor { display: inline-block; width: 8px; height: 14px; background: var(--copper); margin-left: 6px; animation: blink 1s step-end infinite; vertical-align: -2px; }
  @keyframes blink { 50% { opacity: 0; } }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .card-top { padding: 22px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 10px; }
  .status-pill { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 1px; padding: 6px 14px; border-radius: 20px; display: inline-flex; align-items: center; gap: 8px; }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; }
  .status-valid { background: rgba(0, 217, 181, 0.1); color: var(--teal); border: 1px solid rgba(0, 217, 181, 0.35); }
  .status-valid .dot { background: var(--teal); box-shadow: 0 0 8px var(--teal); }
  .status-revoked { background: rgba(255, 92, 92, 0.1); color: var(--red); border: 1px solid rgba(255, 92, 92, 0.35); }
  .status-revoked .dot { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .cert-id { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .cert-id b { color: var(--text); }

  .card-body { padding: 36px 32px; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; color: var(--teal); margin-bottom: 10px; display: block; }
  .name { font-family: var(--disp); font-size: 34px; font-weight: 700; margin-bottom: 6px; }
  .role { font-family: var(--mono); font-size: 14px; color: var(--copper); margin-bottom: 24px; }

  .field { margin-bottom: 18px; }
  .field .k { font-family: var(--mono); font-size: 10.5px; letter-spacing: 1.5px; color: var(--muted); display: block; margin-bottom: 5px; }
  .field .v { font-size: 14.5px; line-height: 1.6; color: var(--text); }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .tag { font-family: var(--mono); font-size: 11.5px; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 8px; }
  .divider { height: 1px; background: var(--line); margin: 28px 0; }

  .verify-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; }
  .verify-meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); line-height: 1.8; }
  .verify-meta b { color: var(--text); }
  .qr-box { background: #F2EFE9; padding: 8px; border-radius: 6px; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
  .btn { font-family: var(--mono); font-size: 13px; letter-spacing: 0.4px; padding: 12px 22px; border-radius: 4px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border: none; transition: background .2s ease, border-color .2s ease, color .2s ease; }
  .btn-linkedin { background: #0A66C2; color: #fff; font-weight: 700; }
  .btn-linkedin:hover { background: #0b74d9; }
  .btn-ghost { border: 1px solid var(--line); color: var(--text); background: transparent; }
  .btn-ghost:hover { border-color: var(--copper); color: var(--copper); }

  .revoked-note { background: rgba(255, 92, 92, 0.08); border: 1px solid rgba(255, 92, 92, 0.3); border-radius: 6px; padding: 14px 18px; font-family: var(--mono); font-size: 13px; color: var(--red); margin-bottom: 24px; }

  .not-found { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 48px 32px; text-align: center; }
  .not-found .icon { font-family: var(--mono); font-size: 30px; color: var(--red); margin-bottom: 16px; }
  .not-found h2 { font-family: var(--disp); font-size: 22px; margin-bottom: 10px; }
  .not-found p { color: var(--muted); font-size: 14px; margin-bottom: 26px; max-width: 420px; margin-left: auto; margin-right: auto; }

  footer { position: relative; z-index: 1; border-top: 1px solid var(--line); padding: 24px 5vw; text-align: center; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

  @media (max-width:640px) {
    .grid2 { grid-template-columns: 1fr; }
    .card-body { padding: 28px 22px; }
    .verify-footer { flex-direction: column; align-items: flex-start; }
    .lookup-row { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="pcb-bg"></div>

<nav>
  <a class="logo" href="/">DARK<span>SYNTAX</span></a>
  <a class="back" href="/">← back to internships</a>
</nav>

<main>
  <div class="wrap" id="app">
    <div class="boot">[ .. ] connecting to certificate registry<span class="cursor"></span></div>
  </div>
</main>

<footer>
  Certificates are issued and verified by DarkSyntax · Udyam No. UDYAM-PY-03-0058394 · darksyntax.xyz
</footer>

<script>
const ORG_NAME = "DarkSyntax";
const app = document.getElementById('app');

function esc(s){ const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}

function monthsBetween(start, end){
  const s = new Date(start), e = new Date(end);
  let m = (e.getFullYear()-s.getFullYear())*12 + (e.getMonth()-s.getMonth());
  if(e.getDate() < s.getDate()) m -= 1;
  return Math.max(m,1);
}

function goTo(id){
  const url = new URL(window.location.href);
  url.searchParams.set('id', id);
  window.location.href = url.toString();
}

function renderLookup(){
  app.innerHTML = `
    <div class="lookup">
      <h1>Verify a certificate</h1>
      <p>Enter the certificate ID printed on the bottom of the certificate (e.g. <span style="color:var(--copper)">TS-2026-0007</span>) or scan its QR code.</p>
      <div class="lookup-row">
        <input id="cert-input" type="text" placeholder="TS-2026-0007" autocomplete="off" autocapitalize="characters">
        <button id="cert-go">Verify</button>
      </div>
    </div>
  `;
  wireLookup();
}

function wireLookup(){
  const btn = document.getElementById('cert-go');
  const input = document.getElementById('cert-input');
  if(!btn || !input) return;
  const go = () => { const v = input.value.trim(); if(v) goTo(v); };
  btn.addEventListener('click', go);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
}

function renderNotFound(id){
  app.innerHTML = `
    <div class="not-found">
      <div class="icon">[ ! ]</div>
      <h2>No certificate found for "${esc(id)}"</h2>
      <p>Double-check the certificate ID and try again, or contact DarkSyntax directly if you believe this is an error.</p>
      <div class="lookup-row" style="margin:0 auto;">
        <input id="cert-input" type="text" placeholder="TS-2026-0007" autocomplete="off">
        <button id="cert-go">Verify</button>
      </div>
    </div>
  `;
  wireLookup();
}

function renderError(){
  app.innerHTML = `
    <div class="not-found">
      <div class="icon">[ ! ]</div>
      <h2>Couldn't reach the certificate registry</h2>
      <p>Something went wrong talking to the server. Try again in a moment, or contact DarkSyntax if this keeps happening.</p>
    </div>
  `;
}

function renderCert(cert){
  const isValid = cert.status === 'valid';
  const verifyUrl = window.location.origin + window.location.pathname + '?id=' + encodeURIComponent(cert.id);
  const skills = (cert.skills || '').split(',').map(s => s.trim()).filter(Boolean);
  const duration = monthsBetween(cert.start_date, cert.end_date);

  const issueDate = new Date(cert.issued_at || cert.created_at);
  const linkedinParams = new URLSearchParams({
    startTask: 'CERTIFICATION_NAME',
    name: cert.role,
    organizationName: ORG_NAME,
    issueYear: String(issueDate.getFullYear()),
    issueMonth: String(issueDate.getMonth() + 1),
    certUrl: verifyUrl,
    certId: cert.id,
  });
  const linkedinUrl = 'https://www.linkedin.com/profile/add?' + linkedinParams.toString();

  app.innerHTML = `
    <div class="card">
      <div class="card-top">
        <span class="status-pill ${isValid ? 'status-valid' : 'status-revoked'}">
          <span class="dot"></span>${isValid ? 'VERIFIED · ACTIVE' : 'REVOKED'}
        </span>
        <span class="cert-id">ID <b>${esc(cert.id)}</b></span>
      </div>
      <div class="card-body">
        ${!isValid ? `<div class="revoked-note">[ ! ] This certificate has been revoked and is no longer considered valid.</div>` : ''}
        <span class="eyebrow">CERTIFICATE OF INTERNSHIP COMPLETION</span>
        <div class="name">${esc(cert.intern_name)}</div>
        <div class="role">${esc(cert.role)}</div>

        <div class="field">
          <span class="k">PROJECT / CONTRIBUTION</span>
          <span class="v">${esc(cert.project)}</span>
        </div>

        <div class="grid2">
          <div class="field">
            <span class="k">DURATION</span>
            <span class="v">${fmtDate(cert.start_date)} – ${fmtDate(cert.end_date)} (${duration} month${duration!==1?'s':''})</span>
          </div>
          <div class="field">
            <span class="k">ISSUED BY</span>
            <span class="v">${esc(cert.mentor || 'SANJJAY — Founder, DarkSyntax')}</span>
          </div>
        </div>

        <div class="field">
          <span class="k">SKILLS</span>
          <div class="tags">${skills.map(s => `<span class="tag">${esc(s)}</span>`).join('')}</div>
        </div>

        <div class="divider"></div>

        <div class="verify-footer">
          <div class="verify-meta">
            Issuing org: <b>${esc(ORG_NAME)}</b><br>
            Udyam Reg. No.: <b>${esc(cert.udyam_no || 'UDYAM-PY-03-0058394')}</b><br>
            Issued: <b>${fmtDate((cert.issued_at || cert.created_at || '').slice(0,10))}</b>
          </div>
          <div class="qr-box" id="qrcode"></div>
        </div>

        <div class="actions">
          <a class="btn btn-linkedin" href="${linkedinUrl}" target="_blank" rel="noopener">+ Add to LinkedIn profile</a>
          ${cert.cert_pdf_url ? `<a class="btn btn-ghost" href="${esc(cert.cert_pdf_url)}" target="_blank" rel="noopener">Download certificate</a>` : ''}
          <button class="btn btn-ghost" id="copy-link">Copy verification link</button>
        </div>
      </div>
    </div>
  `;

  if(window.QRCode){
    new QRCode(document.getElementById('qrcode'), {
      text: verifyUrl, width: 80, height: 80,
      colorDark: '#0A0C0E', colorLight: '#F2EFE9', correctLevel: QRCode.CorrectLevel.M
    });
  }

  const copyBtn = document.getElementById('copy-link');
  if(copyBtn){
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(verifyUrl).then(() => {
        copyBtn.textContent = 'Copied ✓';
        setTimeout(() => copyBtn.textContent = 'Copy verification link', 1800);
      });
    });
  }
}

async function fetchCertificate(id){
  const res = await fetch('/api/certificate?id=' + encodeURIComponent(id), {
    headers: { 'Accept': 'application/json' }
  });
  let result;
  try { result = await res.json(); } catch(e) { result = null; }

  if(res.status === 404) return null;
  if(!res.ok || !result || !result.ok) throw new Error((result && result.error) || 'Request failed');
  return result.certificate;
}

async function init(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if(!id){
    renderLookup();
    return;
  }

  try{
    const cert = await fetchCertificate(id);
    if(!cert){
      renderNotFound(id);
      return;
    }
    renderCert(cert);
  }catch(e){
    console.error(e);
    renderError();
  }
}

init();
</script>

</body>
</html>
