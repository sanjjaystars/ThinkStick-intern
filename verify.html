<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Certificate — DarkSyntax</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
  :root {
    --bg: #F3F2EF;
    --surface: #FFFFFF;
    --border: #D9DDE1;
    --border-strong: #C1C7CD;
    --text: #1A1D21;
    --muted: #5E6B7A;
    --primary: #0A66C2;
    --primary-hover: #084E96;
    --primary-soft: #EAF3FC;
    --success: #057642;
    --success-soft: #E9F5EE;
    --danger: #B3261E;
    --danger-soft: #FDEDEC;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  ::selection { background: var(--primary-soft); color: var(--primary); }
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 5vw; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  nav .logo { font-weight: 800; font-size: 18px; letter-spacing: -0.3px; text-decoration: none; color: var(--text); }
  nav .logo span { color: var(--primary); }
  nav a.back { color: var(--muted); text-decoration: none; font-size: 13.5px; }
  nav a.back:hover { color: var(--text); }

  main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 40px 5vw 100px;
  }
  .wrap { width: 100%; max-width: 760px; }

  .lookup {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 1px 8px rgba(16,24,40,0.04);
    padding: 40px; text-align: center;
  }
  .lookup h1 { font-weight: 800; font-size: 24px; margin-bottom: 10px; letter-spacing: -0.3px; }
  .lookup p { color: var(--muted); font-size: 14px; margin-bottom: 26px; }
  .lookup-row { display: flex; gap: 10px; max-width: 420px; margin: 0 auto; }
  .lookup input {
    flex: 1; background: var(--surface); border: 1px solid var(--border-strong); color: var(--text);
    font-family: var(--font); font-size: 14px; padding: 11px 14px; border-radius: 6px;
  }
  .lookup input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .lookup button {
    font-size: 14px; font-weight: 700;
    background: var(--primary); color: #fff; border: none; border-radius: 24px;
    padding: 0 24px; cursor: pointer; transition: background .15s ease;
  }
  .lookup button:hover { background: var(--primary-hover); }

  .or-divider {
    display: flex; align-items: center; gap: 14px; max-width: 420px; margin: 22px auto;
    font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.5px;
  }
  .or-divider::before, .or-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .scan-btn {
    font-size: 14px; font-weight: 700;
    background: var(--surface); color: var(--primary); border: 1px solid var(--primary);
    border-radius: 24px; padding: 11px 24px; cursor: pointer; display: inline-flex;
    align-items: center; gap: 9px; transition: background .15s ease;
  }
  .scan-btn:hover { background: var(--primary-soft); }
  .scan-btn .cam-icon { width: 15px; height: 15px; flex-shrink: 0; }

  .boot { font-size: 14px; color: var(--muted); text-align: center; padding: 60px 20px; }
  .boot .cursor { display: inline-block; width: 8px; height: 14px; background: var(--primary); margin-left: 6px; animation: blink 1s step-end infinite; vertical-align: -2px; }
  @keyframes blink { 50% { opacity: 0; } }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 1px 8px rgba(16,24,40,0.04); }
  .card-top { padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; background: var(--bg); }
  .status-pill { font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; padding: 6px 14px; border-radius: 20px; display: inline-flex; align-items: center; gap: 8px; }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; }
  .status-valid { background: var(--success-soft); color: var(--success); border: 1px solid rgba(5,118,66,0.25); }
  .status-valid .dot { background: var(--success); }
  .status-revoked { background: var(--danger-soft); color: var(--danger); border: 1px solid rgba(179,38,30,0.25); }
  .status-revoked .dot { background: var(--danger); }
  .cert-id { font-size: 12.5px; color: var(--muted); }
  .cert-id b { color: var(--text); }

  .card-body { padding: 36px 32px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: var(--primary); margin-bottom: 10px; display: block; }
  .name { font-weight: 800; font-size: 30px; letter-spacing: -0.4px; margin-bottom: 6px; }
  .role { font-size: 14.5px; font-weight: 600; color: var(--primary); margin-bottom: 24px; }

  .field { margin-bottom: 18px; }
  .field .k { font-size: 11px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 5px; }
  .field .v { font-size: 14.5px; line-height: 1.6; color: var(--text); }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .tag { font-size: 12.5px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 8px; }
  .divider { height: 1px; background: var(--border); margin: 28px 0; }

  .verify-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; }
  .verify-meta { font-size: 12.5px; color: var(--muted); line-height: 1.8; }
  .verify-meta b { color: var(--text); }
  .qr-box { background: var(--surface); border: 1px solid var(--border); padding: 8px; border-radius: 8px; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
  .btn { font-size: 13.5px; font-weight: 700; padding: 11px 22px; border-radius: 24px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border: none; transition: background .15s ease, border-color .15s ease, color .15s ease; }
  .btn-linkedin { background: #0A66C2; color: #fff; }
  .btn-linkedin:hover { background: #084E96; }
  .btn-ghost { border: 1px solid var(--border-strong); color: var(--text); background: var(--surface); }
  .btn-ghost:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

  .revoked-note { background: var(--danger-soft); border: 1px solid rgba(179,38,30,0.25); border-radius: 8px; padding: 14px 18px; font-size: 13.5px; color: var(--danger); margin-bottom: 24px; }

  .not-found { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 1px 8px rgba(16,24,40,0.04); padding: 48px 32px; text-align: center; }
  .not-found .icon { font-size: 30px; margin-bottom: 16px; }
  .not-found h2 { font-weight: 800; font-size: 20px; margin-bottom: 10px; letter-spacing: -0.3px; }
  .not-found p { color: var(--muted); font-size: 14px; margin-bottom: 26px; max-width: 420px; margin-left: auto; margin-right: auto; }

  footer { border-top: 1px solid var(--border); background: var(--surface); padding: 22px 5vw; text-align: center; font-size: 12.5px; color: var(--muted); }

  /* ---- QR scanner overlay ---- */
  .scanner-overlay {
    position: fixed; inset: 0; z-index: 100; background: rgba(26,29,33,0.6);
    display: none; align-items: center; justify-content: center; padding: 20px;
    backdrop-filter: blur(3px);
  }
  .scanner-overlay.show { display: flex; }
  .scanner-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px; width: 100%; max-width: 440px; text-align: center;
    box-shadow: 0 8px 30px rgba(16,24,40,0.15);
  }
  .scanner-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .scanner-head h3 { font-weight: 700; font-size: 17px; }
  .scanner-close {
    background: var(--bg); border: 1px solid var(--border); color: var(--muted);
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
    transition: border-color .15s ease, color .15s ease;
  }
  .scanner-close:hover { border-color: var(--primary); color: var(--primary); }
  .scanner-video-wrap {
    position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden;
    background: #000; border: 1px solid var(--border);
  }
  .scanner-video-wrap video { width: 100%; height: 100%; object-fit: cover; }
  .scan-frame {
    position: absolute; inset: 14%; border: 2px solid var(--primary); border-radius: 10px;
    box-shadow: 0 0 0 999px rgba(0,0,0,0.35); pointer-events: none;
  }
  .scan-frame::before, .scan-frame::after {
    content: ""; position: absolute; width: 22px; height: 22px; border: 3px solid #fff;
  }
  .scan-frame::before { top: -3px; left: -3px; border-right: none; border-bottom: none; }
  .scan-frame::after { bottom: -3px; right: -3px; border-left: none; border-top: none; }
  .scan-line {
    position: absolute; left: 14%; right: 14%; top: 14%; height: 2px; background: var(--primary);
    box-shadow: 0 0 8px var(--primary); animation: scanmove 2s ease-in-out infinite;
  }
  @keyframes scanmove { 0%,100% { top: 14%; } 50% { top: 84%; } }
  .scanner-status {
    font-size: 12.5px; color: var(--muted); margin-top: 16px; min-height: 18px;
  }
  .scanner-status.err { color: var(--danger); }
  .scanner-status.ok { color: var(--success); }

  @media (max-width:640px) {
    .grid2 { grid-template-columns: 1fr; }
    .card-body { padding: 28px 22px; }
    .verify-footer { flex-direction: column; align-items: flex-start; }
    .lookup-row { flex-direction: column; }
  }
</style>
</head>
<body>

<nav>
  <a class="logo" href="/">DARK<span>SYNTAX</span></a>
  <a class="back" href="/">← Back to internships</a>
</nav>

<main>
  <div class="wrap" id="app">
    <div class="boot">Connecting to certificate registry<span class="cursor"></span></div>
  </div>
</main>

<footer>
  Certificates are issued and verified by DarkSyntax · Udyam No. UDYAM-PY-03-0058394 · darksyntax.xyz
</footer>

<!-- QR scanner overlay -->
<div class="scanner-overlay" id="scanner-overlay">
  <div class="scanner-panel">
    <div class="scanner-head">
      <h3>Scan certificate QR</h3>
      <button class="scanner-close" id="scanner-close" aria-label="Close">✕</button>
    </div>
    <div class="scanner-video-wrap">
      <video id="scanner-video" playsinline muted autoplay></video>
      <div class="scan-frame"></div>
      <div class="scan-line"></div>
    </div>
    <div class="scanner-status" id="scanner-status">Point your camera at the QR code on the certificate.</div>
  </div>
</div>

<script>
const ORG_NAME = "DarkSyntax";
const app = document.getElementById('app');

function esc(s){ const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}

function monthsBetween(start, end){
  const s = new Date(start), e = new Date(end);
  let m = (e.getFullYear()-s.getFullYear())*12 + (e.getMonth()-s.getMonth());
  if(e.getDate() < s.getDate()) m -= 1;
  return Math.max(m,1);
}

function goTo(id){
  const url = new URL(window.location.href);
  url.searchParams.set('id', id);
  window.location.href = url.toString();
}

const CAM_ICON = `<svg class="cam-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 8a2 2 0 0 1 2-2h1.5l1-1.5h7l1 1.5H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12.5" r="3.4" stroke="currentColor" stroke-width="1.6"/></svg>`;

function scanButtonHTML(){
  return `
    <div class="or-divider">OR</div>
    <button class="scan-btn" id="scan-open" type="button">${CAM_ICON}Scan QR code</button>
  `;
}

function renderLookup(){
  app.innerHTML = `
    <div class="lookup">
      <h1>Verify a certificate</h1>
      <p>Enter the certificate ID printed on the bottom of the certificate (e.g. <span style="color:var(--primary); font-weight:600;">TS-2026-0007</span>) or scan its QR code.</p>
      <div class="lookup-row">
        <input id="cert-input" type="text" placeholder="TS-2026-0007" autocomplete="off" autocapitalize="characters">
        <button id="cert-go">Verify</button>
      </div>
      ${scanButtonHTML()}
    </div>
  `;
  wireLookup();
  wireScanButton();
}

function wireLookup(){
  const btn = document.getElementById('cert-go');
  const input = document.getElementById('cert-input');
  if(!btn || !input) return;
  const go = () => { const v = input.value.trim(); if(v) goTo(v); };
  btn.addEventListener('click', go);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
}

function wireScanButton(){
  const btn = document.getElementById('scan-open');
  if(btn) btn.addEventListener('click', openScanner);
}

function renderNotFound(id){
  app.innerHTML = `
    <div class="not-found">
      <div class="icon">⚠️</div>
      <h2>No certificate found for "${esc(id)}"</h2>
      <p>Double-check the certificate ID and try again, or contact DarkSyntax directly if you believe this is an error.</p>
      <div class="lookup-row" style="margin:0 auto;">
        <input id="cert-input" type="text" placeholder="TS-2026-0007" autocomplete="off">
        <button id="cert-go">Verify</button>
      </div>
      ${scanButtonHTML()}
    </div>
  `;
  wireLookup();
  wireScanButton();
}

function renderError(){
  app.innerHTML = `
    <div class="not-found">
      <div class="icon">⚠️</div>
      <h2>Couldn't reach the certificate registry</h2>
      <p>Something went wrong talking to the server. Try again in a moment, or contact DarkSyntax if this keeps happening.</p>
    </div>
  `;
}

function renderCert(cert){
  const isValid = cert.status === 'valid';
  const verifyUrl = window.location.origin + window.location.pathname + '?id=' + encodeURIComponent(cert.id);
  const skills = (cert.skills || '').split(',').map(s => s.trim()).filter(Boolean);
  const duration = monthsBetween(cert.start_date, cert.end_date);

  const issueDate = new Date(cert.issued_at || cert.created_at);
  const linkedinParams = new URLSearchParams({
    startTask: 'CERTIFICATION_NAME',
    name: cert.role,
    organizationName: ORG_NAME,
    issueYear: String(issueDate.getFullYear()),
    issueMonth: String(issueDate.getMonth() + 1),
    certUrl: verifyUrl,
    certId: cert.id,
  });
  const linkedinUrl = 'https://www.linkedin.com/profile/add?' + linkedinParams.toString();
  const downloadUrl = '/api/certificate-file?id=' + encodeURIComponent(cert.id);

  app.innerHTML = `
    <div class="card">
      <div class="card-top">
        <span class="status-pill ${isValid ? 'status-valid' : 'status-revoked'}">
          <span class="dot"></span>${isValid ? 'Verified · Active' : 'Revoked'}
        </span>
        <span class="cert-id">ID <b>${esc(cert.id)}</b></span>
      </div>
      <div class="card-body">
        ${!isValid ? `<div class="revoked-note">⚠️ This certificate has been revoked and is no longer considered valid.</div>` : ''}
        <span class="eyebrow">Certificate of Internship Completion</span>
        <div class="name">${esc(cert.intern_name)}</div>
        <div class="role">${esc(cert.role)}</div>

        <div class="field">
          <span class="k">Project / Contribution</span>
          <span class="v">${esc(cert.project)}</span>
        </div>

        <div class="grid2">
          <div class="field">
            <span class="k">Duration</span>
            <span class="v">${fmtDate(cert.start_date)} – ${fmtDate(cert.end_date)} (${duration} month${duration!==1?'s':''})</span>
          </div>
          <div class="field">
            <span class="k">Issued by</span>
            <span class="v">${esc(cert.mentor || 'SANJJAY — Founder, DarkSyntax')}</span>
          </div>
        </div>

        <div class="field">
          <span class="k">Skills</span>
          <div class="tags">${skills.map(s => `<span class="tag">${esc(s)}</span>`).join('')}</div>
        </div>

        <div class="divider"></div>

        <div class="verify-footer">
          <div class="verify-meta">
            Issuing org: <b>${esc(ORG_NAME)}</b><br>
            Udyam Reg. No.: <b>${esc(cert.udyam_no || 'UDYAM-PY-03-0058394')}</b><br>
            Issued: <b>${fmtDate((cert.issued_at || cert.created_at || '').slice(0,10))}</b>
          </div>
          <div class="qr-box" id="qrcode"></div>
        </div>

        <div class="actions">
          <a class="btn btn-linkedin" href="${linkedinUrl}" target="_blank" rel="noopener">+ Add to LinkedIn profile</a>
          <a class="btn btn-ghost" href="${downloadUrl}" target="_blank" rel="noopener">Download certificate (PDF)</a>
          <button class="btn btn-ghost" id="copy-link">Copy verification link</button>
        </div>
      </div>
    </div>
  `;

  if(window.QRCode){
    new QRCode(document.getElementById('qrcode'), {
      text: verifyUrl, width: 80, height: 80,
      colorDark: '#1A1D21', colorLight: '#FFFFFF', correctLevel: QRCode.CorrectLevel.M
    });
  }

  const copyBtn = document.getElementById('copy-link');
  if(copyBtn){
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(verifyUrl).then(() => {
        copyBtn.textContent = 'Copied ✓';
        setTimeout(() => copyBtn.textContent = 'Copy verification link', 1800);
      });
    });
  }
}

async function fetchCertificate(id){
  const res = await fetch('/api/certificate?id=' + encodeURIComponent(id), {
    headers: { 'Accept': 'application/json' }
  });
  let result;
  try { result = await res.json(); } catch(e) { result = null; }

  if(res.status === 404) return null;
  if(!res.ok || !result || !result.ok) throw new Error((result && result.error) || 'Request failed');
  return result.certificate;
}

async function init(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if(!id){
    renderLookup();
    return;
  }

  try{
    const cert = await fetchCertificate(id);
    if(!cert){
      renderNotFound(id);
      return;
    }
    renderCert(cert);
  }catch(e){
    console.error(e);
    renderError();
  }
}

init();

// ============================================================================
// QR camera scanner
// ============================================================================
let scannerStream = null;
let scannerRAF = null;
let scannerCanvas = null;
let scannerCtx = null;

function extractCertId(text){
  if(!text) return null;
  text = text.trim();
  try{
    const u = new URL(text);
    const fromParam = u.searchParams.get('id');
    if(fromParam) return fromParam.trim();
  }catch(e){
    // not a URL — fall through
  }
  // Accept a bare certificate ID too (e.g. "TS-2026-0007")
  if(/^[A-Za-z0-9][A-Za-z0-9\-_.]{2,60}$/.test(text)) return text;
  return null;
}

function setScannerStatus(msg, kind){
  const el = document.getElementById('scanner-status');
  if(!el) return;
  el.textContent = msg;
  el.className = 'scanner-status' + (kind ? ' ' + kind : '');
}

async function openScanner(){
  const overlay = document.getElementById('scanner-overlay');
  const video = document.getElementById('scanner-video');
  overlay.classList.add('show');
  setScannerStatus('Requesting camera access…');

  if(!window.jsQR){
    setScannerStatus('QR scanner failed to load. Please enter the ID manually.', 'err');
    return;
  }

  try{
    scannerStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    video.srcObject = scannerStream;
    await video.play();
    setScannerStatus('Point your camera at the QR code on the certificate.');

    scannerCanvas = document.createElement('canvas');
    scannerCtx = scannerCanvas.getContext('2d', { willReadFrequently: true });
    scannerRAF = requestAnimationFrame(scanFrame);
  }catch(err){
    console.error(err);
    if(err && err.name === 'NotAllowedError'){
      setScannerStatus('Camera permission denied. Allow camera access, or enter the ID manually.', 'err');
    }else if(err && err.name === 'NotFoundError'){
      setScannerStatus('No camera found on this device. Enter the ID manually instead.', 'err');
    }else{
      setScannerStatus('Could not start the camera. Enter the ID manually instead.', 'err');
    }
  }
}

function scanFrame(){
  const video = document.getElementById('scanner-video');
  if(!video || video.readyState !== video.HAVE_ENOUGH_DATA){
    scannerRAF = requestAnimationFrame(scanFrame);
    return;
  }

  scannerCanvas.width = video.videoWidth;
  scannerCanvas.height = video.videoHeight;
  scannerCtx.drawImage(video, 0, 0, scannerCanvas.width, scannerCanvas.height);
  const imageData = scannerCtx.getImageData(0, 0, scannerCanvas.width, scannerCanvas.height);
  const code = window.jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });

  if(code && code.data){
    const certId = extractCertId(code.data);
    if(certId){
      setScannerStatus('Found: ' + certId + ' — opening…', 'ok');
      closeScanner();
      goTo(certId);
      return;
    }else{
      setScannerStatus("Scanned a code, but it isn't a recognized certificate link.", 'err');
    }
  }

  scannerRAF = requestAnimationFrame(scanFrame);
}

function closeScanner(){
  const overlay = document.getElementById('scanner-overlay');
  const video = document.getElementById('scanner-video');
  overlay.classList.remove('show');

  if(scannerRAF) cancelAnimationFrame(scannerRAF);
  scannerRAF = null;

  if(scannerStream){
    scannerStream.getTracks().forEach(t => t.stop());
    scannerStream = null;
  }
  if(video) video.srcObject = null;
}

document.getElementById('scanner-close').addEventListener('click', closeScanner);
document.getElementById('scanner-overlay').addEventListener('click', (e) => {
  if(e.target.id === 'scanner-overlay') closeScanner();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closeScanner();
});
</script>

</body>
